<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - MediTrust AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="brand"><a href="{{ url_for('index') }}">MediTrust <span>AI</span></a></div>
  </nav>

  <div class="auth-wrapper">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-box">
      <div class="auth-toggle">
        <button type="button" class="toggle-btn active" id="showLoginBtn" onclick="showAuth('login')">Login</button>
        <button type="button" class="toggle-btn" id="showRegisterBtn" onclick="showAuth('register')">Register</button>
      </div>

      <form method="POST" action="{{ url_for('login') }}" id="loginForm" class="auth-form active">
        <h2>Welcome Back</h2>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p class="switch-text">Don't have an account? <a onclick="showAuth('register')">Register here</a></p>
      </form>

      <form method="POST" action="{{ url_for('register') }}" id="registerForm" class="auth-form">
        <h2>Create Account</h2>
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
        <p class="switch-text">Already have an account? <a onclick="showAuth('login')">Login here</a></p>
      </form>
    </div>
  </div>

  <script>
    function showAuth(which) {
      document.getElementById('loginForm').classList.toggle('active', which === 'login');
      document.getElementById('registerForm').classList.toggle('active', which === 'register');
      document.getElementById('showLoginBtn').classList.toggle('active', which === 'login');
      document.getElementById('showRegisterBtn').classList.toggle('active', which === 'register');
    }
  </script>
</body>
</html>

<!-- Floating chat widget -->
<button id="cw-launcher" class="chat-widget-launcher" aria-label="Open chat" aria-expanded="false">
  <svg class="chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <svg class="close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M18 6 6 18M6 6l12 12"/>
  </svg>
  <span id="cw-badge" class="chat-widget-badge"></span>
</button>

<div id="cw-panel" class="chat-widget-panel" role="dialog" aria-label="MediTrust AI chat">
  <div class="chat-widget-header">
    <div class="avatar">🩺</div>
    <div>
      <div class="title">MediTrust AI</div>
      <div class="subtitle">Hospital assistant</div>
    </div>
    <div class="chat-widget-status"><span class="dot"></span>Online</div>
  </div>

  <div id="cw-body" class="chat-widget-body">
    <div class="bot-msg">
      Hi {{ username }}! I'm MediTrust AI. Ask me about departments, visiting
      hours, appointments, billing, or hospital facilities.
    </div>
  </div>

  <form id="cw-form" class="chat-widget-form">
    <input id="cw-input" type="text" placeholder="Type your question..." autocomplete="off" required>
    <button id="cw-send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
      </svg>
    </button>
  </form>
</div>

<script src="{{ url_for('static', filename='chat-widget.js') }}"></script>
<!-- ===== SOS Emergency Button ===== -->
<button id="sos-launcher" class="sos-launcher" aria-label="Emergency SOS" onclick="openSosModal()">
  🆘
</button>

<div id="sos-overlay" class="order-overlay">
  <div class="order-modal">
    <div class="order-modal-header">
      <h3>Emergency SOS</h3>
      <button type="button" class="order-close" onclick="closeSosModal()">✕</button>
    </div>
    <p class="order-modal-subtitle">
      This sends an immediate alert to hospital staff with your room number.
    </p>

    <form id="sos-form">
      <label class="order-label">Room Number</label>
      <input type="text" id="sos-room" placeholder="e.g. 204" required>

      <label class="order-label">What's happening? (optional)</label>
      <textarea id="sos-message" rows="2" placeholder="Brief description"></textarea>

      <button type="submit" class="sos-submit-btn">🆘 Send Emergency Alert</button>
      <p id="sos-status" class="order-status"></p>
    </form>
  </div>
</div>

<script>
  function openSosModal() {
    document.getElementById("sos-status").textContent = "";
    document.getElementById("sos-overlay").classList.add("open");
  }
  function closeSosModal() {
    document.getElementById("sos-overlay").classList.remove("open");
  }
  document.getElementById("sos-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const room = document.getElementById("sos-room").value.trim();
    const message = document.getElementById("sos-message").value.trim();
    const statusEl = document.getElementById("sos-status");

    try {
      const res = await fetch("{{ url_for('api_sos') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room_number: room, message })
      });
      const data = await res.json();
      if (res.ok) {
        statusEl.textContent = "Alert sent! Staff have been notified.";
        statusEl.style.color = "#0f766e";
        document.getElementById("sos-form").reset();
        setTimeout(closeSosModal, 1800);
      } else {
        statusEl.textContent = data.error || "Something went wrong.";
        statusEl.style.color = "#b91c1c";
      }
    } catch (err) {
      statusEl.textContent = "Could not send alert. Try again.";
      statusEl.style.color = "#b91c1c";
    }
  });
</script>
